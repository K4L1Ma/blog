<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/dark.css" | relative_url }}?v=2">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <link rel="me" href="https://www.linkedin.com/in/eduardorgolding/">
  <meta name="author" content="Eduardo R. Golding">

  {%- if page.layout == 'post' -%}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
    "author": {
      "@type": "Person",
      "name": "Eduardo R. Golding",
      "url": "https://www.linkedin.com/in/eduardorgolding/",
      "sameAs": ["https://www.linkedin.com/in/eduardorgolding/"]
    }
  }
  </script>
  {%- endif -%}
</head>
